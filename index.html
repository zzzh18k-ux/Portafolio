<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Mini App 🚀</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        /* Iframe de la página 🌐 */
        #mi-pagina {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        /* Pantalla de espera 🎨 */
        #pantalla-mensaje {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 12px;
        }

        p {
            font-size: 16px;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        #boton-anuncio {
            background-color: white;
            color: #764ba2;
            border: none;
            padding: 14px 28px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.25);
        }

        #boton-anuncio:disabled {
            background-color: #d1d1d1;
            color: #666666;
            cursor: not-allowed;
        }

        /* 💡 Cartel flotante con la instrucción de descarga */
        #aviso-descarga {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 380px;
            background-color: rgba(20, 20, 20, 0.92);
            color: #ffffff;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 13px;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.15);
            z-index: 50;
            display: none; /* Se activa al abrir la app */
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <!-- Pantalla de bienvenida ✨ -->
    <div id="pantalla-mensaje">
        <h1>¡Bienvenido/a! 🖼️💖</h1>
        <p>Presiona el botón para desbloquear tu acceso libre por 24 horas 🚀</p>
        <button id="boton-anuncio" onclick="simularAnuncio()">▶️ Continuar (5/5)</button>
    </div>

    <!-- Página incrustada 🌐 -->
    <iframe id="mi-pagina" src="https://imagefree.net/"></iframe>

    <!-- Mensaje flotante de descarga 📥 -->
    <div id="aviso-descarga">
        💡 <b>Para descargar:</b> Mantén presionada la imagen 2 segundos y elige <i>"Descargar imagen"</i> 📲
    </div>

    <script>
        function revisarAcceso() {
            const tiempoGuardado = localStorage.getItem('acceso_app');
            if (tiempoGuardado) {
                const tiempoPasado = Date.now() - parseInt(tiempoGuardado);
                const veinticuatroHoras = 24 * 60 * 60 * 1000;
                if (tiempoPasado < veinticuatroHoras) {
                    mostrarAplicacion();
                }
            }
        }

        function simularAnuncio() {
            const boton = document.getElementById('boton-anuncio');
            let contador = 5;
            boton.disabled = true;

            const temporizador = setInterval(() => {
                contador--;
                if (contador > 0) {
                    boton.innerText = `⏳ Espere... (${contador}/5)`;
                } else {
                    clearInterval(temporizador);
                    boton.innerText = "¡Listo! 🎉";
                    localStorage.setItem('acceso_app', Date.now());
                    setTimeout(mostrarAplicacion, 400);
                }
            }, 1000);
        }

        function mostrarAplicacion() {
            document.getElementById('pantalla-mensaje').style.display = 'none';
            document.getElementById('mi-pagina').style.display = 'block';
            document.getElementById('aviso-descarga').style.display = 'block'; // Aparece el cartelito de ayuda ✨
        }

        revisarAcceso();
    </script>

</body>
</html>
