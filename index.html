<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi App TV 📺</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- ☁️ Conexión con Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- 💰 SDK de Monetag (El motor de anuncios) -->
    <script src='//libtl.com/sdk.js' data-zone='11937394' data-sdk='show_11937394'></script>

    <style>
        :root {
            --azul-claro: #81d4fa;
            --morado: #ce93d8;
            --verde: #aed581;
            --rosado: #f48fb1;
            --blanco: #ffffff;
            --texto: #4a148c;
            --texto-suave: #6a1b9a;
            --vidrio: rgba(255, 255, 255, 0.3);
            --vidrio-borde: rgba(255, 255, 255, 0.6);
            --sombra: 0 8px 32px rgba(0,0,0,0.15);
            --radio: 30px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Fredoka', sans-serif;
            color: var(--texto);
        }

        body {
            background: linear-gradient(135deg, #e1f5fe 0%, #f3e5f5 25%, #e8f5e9 50%, #fce4ec 75%, #e1f5fe 100%);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 15% 30%, rgba(129,212,250,0.3) 0%, transparent 50%),
                radial-gradient(circle at 85% 60%, rgba(206,147,216,0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(174,213,129,0.3) 0%, transparent 50%),
                radial-gradient(circle at 70% 20%, rgba(244,143,177,0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .top-card {
            background: var(--vidrio);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 2px solid var(--vidrio-borde);
            padding: 15px 20px;
            box-shadow: var(--sombra);
            z-index: 10;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-container {
            display: flex;
            flex-direction: column;
        }

        .balance-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--texto-suave);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-display {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #81d4fa, #ce93d8, #f48fb1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: transform 0.3s ease;
            line-height: 1.2;
        }
        
        /* ✨ Equipo Display */
        .equipo-display {
            font-size: 11px;
            font-weight: 700;
            color: #7b1fa2;
            margin-top: 2px;
            background: rgba(255,255,255,0.4);
            padding: 2px 8px;
            border-radius: 10px;
            display: inline-block;
            width: fit-content;
        }

        /* ✨ Animación para cuando el dinero sube */
        .dinero-sube {
            transform: scale(1.3);
            background: linear-gradient(135deg, #aed581, #4caf50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .botones-top {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-retirar-top {
            background: linear-gradient(135deg, #aed581, #9ccc65);
            color: #1b5e20;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #388e3c;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .btn-invitar {
            background: linear-gradient(135deg, #81d4fa, #29b6f6);
            color: #01579b;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #0288d1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s;
        }

        .btn-retirar-top:active, .btn-invitar:active {
            transform: scale(0.95);
        }

        .progress-card {
            background: rgba(255,255,255,0.4);
            backdrop-filter: blur(8px);
            padding: 15px 20px;
            z-index: 10;
            position: relative;
            border-bottom: 1px solid var(--vidrio-borde);
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: rgba(255,255,255,0.4);
            border-radius: 15px;
            overflow: hidden;
            margin: 8px 0;
            border: 2px solid rgba(255,255,255,0.8);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #81d4fa, #ce93d8, #f48fb1, #aed581);
            border-radius: 15px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .progress-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--texto);
            margin-bottom: 2px;
        }

        /* 🔘 BOTÓN GRANDE DE RECLAMO */
        .btn-reclamo-gigante {
            background: linear-gradient(135deg, #ce93d8, #ba68c8);
            color: #ffffff;
            border: none;
            padding: 16px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-bottom: 4px solid #7b1fa2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .btn-reclamo-gigante:active {
            transform: scale(0.95);
        }

        .btn-reclamo-gigante:disabled {
            background: rgba(255,255,255,0.5);
            color: #7b1fa2;
            border-bottom: 4px solid rgba(206,147,216,0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .latir {
            animation: latido 1.5s infinite;
            background: linear-gradient(135deg, #aed581, #7cb342);
            border-bottom: 4px solid #558b2f;
        }

        .iframe-container {
            flex: 1;
            width: 100%;
            border: none;
            z-index: 5;
            position: relative;
            background: #fff;
            border-top: 2px solid var(--vidrio-borde);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(74,20,140,0.5);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 50;
            padding: 20px;
        }

        .modal-card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(255,255,255,0.8);
            border-radius: 35px;
            padding: 25px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #81d4fa, #ce93d8, #f48fb1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .input-field {
            width: 100%;
            padding: 12px 16px;
            border-radius: 20px;
            border: 2px solid rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.5);
            font-size: 14px;
            font-weight: 500;
            outline: none;
            margin: 8px 0;
            color: var(--texto);
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: #ce93d8;
            background: rgba(255,255,255,0.9);
        }

        .btn-modal {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-retirar {
            background: linear-gradient(135deg, #ce93d8, #ba68c8);
            color: #4a148c;
            border-left: 5px solid #7b1fa2;
        }

        .btn-cerrar {
            background: linear-gradient(135deg, #f48fb1, #f06292);
            color: #880e4f;
            border-left: 5px solid #c2185b;
            margin-top: 8px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(74,20,140,0.9);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.6);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-weight: 600;
            box-shadow: var(--sombra);
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="top-card">
        <div class="balance-container">
            <span class="balance-label">Tu Balance</span>
            <span class="balance-display">$<span id="saldo-actual">0.000</span></span>
            <!-- ✨ Indicador de Comisión de Equipo -->
            <div class="equipo-display">
                <i class="fas fa-users"></i> Equipo: $<span id="saldo-equipo">0.000</span>
            </div>
        </div>
        
        <div class="botones-top">
            <button class="btn-retirar-top" onclick="abrirModal()">
                <i class="fas fa-wallet"></i> Retirar
            </button>
            <button class="btn-invitar" onclick="invitarAmigos()">
                <i class="fas fa-share-alt"></i> Invitar
            </button>
        </div>
    </div>

    <div class="progress-card">
        <div class="progress-text" id="texto-meta">Progreso para recompensa: 0/20 🎯</div>
        <div class="progress-bar">
            <div class="progress-fill" id="barra-color"></div>
        </div>
        
        <!-- 🎁 BOTÓN PRINCIPAL DE DOPAMINA -->
        <button id="btn-reclamar-premio" class="btn-reclamo-gigante" onclick="ejecutarReclamo()">
            <i class="fas fa-gift"></i> RECLAMAR $0.01
        </button>
    </div>

    <!-- La TV sigue reproduciendo abajo automáticamente -->
    <iframe class="iframe-container" src="https://famelack.com/"></iframe>

    <!-- Modal Retiro -->
    <div class="modal" id="modalRetiro">
        <div class="modal-card">
            <div class="modal-title">🏦 Retirar Fondos</div>
            
            <div style="font-size: 12px; font-weight: 600; margin-bottom: 15px; color: var(--texto-suave);">
                <i class="fas fa-info-circle"></i> Mínimo de retiro: $1.00 <br>
                <span style="color: #d32f2f; display: inline-block; margin-top: 5px;">
                    <i class="fas fa-exclamation-triangle"></i> Comisión de retiro: $0.02
                </span>
            </div>

            <select id="metodo" class="input-field">
                <option value="usdt_polygon">USDT POLYGON (matic)</option>
            </select>
            
            <input type="text" id="billetera" class="input-field" placeholder="Pega tu cuenta aquí... 📝">
            
            <button class="btn-modal btn-retirar" onclick="procesarRetiro()">
                <i class="fas fa-paper-plane"></i> Enviar Pago
            </button>
            <button class="btn-modal btn-cerrar" onclick="cerrarModal()">
                <i class="fas fa-times"></i> Volver a la TV
            </button>
        </div>
    </div>

    <div id="toast-ganancia" class="toast">
        ¡Meta cumplida! +$0.01 añadido 🎉
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        // 🐘 Variables del Buzón Fantasma (Firebase)
        const FIREBASE_URL = 'https://tvgramabot-default-rtdb.firebaseio.com/';
        let miId = tg.initDataUnsafe?.user?.id || 'invitado_fantasma';
        let idInvitador = tg.initDataUnsafe?.start_param || null;
        const COMISION_POR_REFERIDO = 0.0004; // 4% del premio de $0.01

        let miSaldo = 0.000; 
        let comisionEquipo = 0.000; // 👥 Inicializado en 0 por ahora
        let videosVistos = 0;
        let metaVideos = 20; 
        let premio = 0.01;   
        let reclamoGratisHecho = false; // Bandera del primer regalo

        const BOT_TOKEN = '8637001726:AAG91rrNSM3KI9biMMQD621LxE1RzsA8n0g';
        const CHAT_ID = '7259926040';

        function enviarChisme(mensaje) {
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: CHAT_ID, text: mensaje })
            });
        }

        function obtenerUsuario() {
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                return tg.initDataUnsafe.user.username ? '@' + tg.initDataUnsafe.user.username : tg.initDataUnsafe.user.first_name;
            }
            return '@UsuarioDesconocido';
        }

        function guardarEnNube() {
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem('saldo_tv', miSaldo.toString());
                tg.CloudStorage.setItem('videos_vistos', videosVistos.toString());
                tg.CloudStorage.setItem('regalo_dado', reclamoGratisHecho.toString());
                tg.CloudStorage.setItem('comision_equipo', comisionEquipo.toString());
            }
        }

        // 📥 LÓGICA DEL BUZÓN: Recoger comisiones y borrar rastro
        function revisarBuzonFirebase() {
            fetch(`${FIREBASE_URL}comisiones/${miId}.json`)
            .then(res => res.json())
            .then(data => {
                if (data && data !== null) {
                    let dineroEncontrado = 0;
                    // Sumamos todas las moneditas que nos enviaron los referidos
                    for (let llave in data) {
                        dineroEncontrado += data[llave].monto;
                    }
                    
                    if (dineroEncontrado > 0) {
                        comisionEquipo += dineroEncontrado;
                        document.getElementById('saldo-equipo').innerText = comisionEquipo.toFixed(4);
                        guardarEnNube();
                        mostrarToast(`¡Tu equipo te generó +$${dineroEncontrado.toFixed(4)}! 👥💸`);
                        
                        // 🧹 Borramos el buzón para ahorrar datos
                        fetch(`${FIREBASE_URL}comisiones/${miId}.json`, { method: 'DELETE' });
                    }
                }
            }).catch(e => console.log("Buzón vacío o en reposo"));
        }

        // 📤 LÓGICA DEL BUZÓN: Enviar pago al invitador
        function enviarComisionFirebase() {
            if (idInvitador && idInvitador !== miId.toString()) {
                fetch(`${FIREBASE_URL}comisiones/${idInvitador}.json`, {
                    method: 'POST',
                    body: JSON.stringify({ monto: COMISION_POR_REFERIDO })
                });
            }
        }

        function cargarDeNube() {
            if (tg.CloudStorage) {
                tg.CloudStorage.getItems(['saldo_tv', 'videos_vistos', 'regalo_dado', 'comision_equipo'], function(error, values) {
                    if (!error && values) {
                        if (values.saldo_tv) miSaldo = parseFloat(values.saldo_tv);
                        if (values.videos_vistos) videosVistos = parseInt(values.videos_vistos);
                        if (values.regalo_dado) reclamoGratisHecho = (values.regalo_dado === 'true');
                        if (values.comision_equipo) comisionEquipo = parseFloat(values.comision_equipo);
                        
                        document.getElementById('saldo-actual').innerText = miSaldo.toFixed(3);
                        document.getElementById('saldo-equipo').innerText = comisionEquipo.toFixed(4);
                        actualizarInterfazBoton();
                        
                        // Revisamos si alguien nos mandó comisiones mientras no estábamos
                        revisarBuzonFirebase(); 
                    }
                });
            } else {
                actualizarInterfazBoton();
            }
        }

        function mostrarToast(mensaje) {
            const toast = document.getElementById("toast-ganancia");
            toast.innerText = mensaje;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        // 🔗 SISTEMA DE INVITACIÓN (Formato startapp para Mini Apps)
        function invitarAmigos() {
            let linkReferido = `https://t.me/tvgrama_bot?startapp=${miId}`;
            let textoInvitacion = '¡Ven a ver TV y gana dinero conmigo! 📺💸';
            
            if (tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(linkReferido)}&text=${encodeURIComponent(textoInvitacion)}`);
            } else {
                navigator.clipboard.writeText(textoInvitacion + '\n' + linkReferido);
                mostrarToast('🔗 ¡Enlace de equipo copiado!');
            }
        }

        function actualizarInterfazBoton() {
            let btn = document.getElementById('btn-reclamar-premio');
            let porcentaje = (videosVistos / metaVideos) * 100;
            document.getElementById('barra-color').style.width = porcentaje + '%';
            document.getElementById('texto-meta').innerText = `Progreso para recompensa: ${videosVistos}/${metaVideos} 🎯`;

            if (!reclamoGratisHecho) {
                btn.disabled = false;
                btn.classList.add('latir');
                btn.innerHTML = '<i class="fas fa-gift"></i> RECLAMAR REGALO $0.01';
            } else if (videosVistos >= metaVideos) {
                btn.disabled = false;
                btn.classList.add('latir');
                btn.innerHTML = '<i class="fas fa-coins"></i> RECLAMAR $0.01';
            } else {
                btn.disabled = true;
                btn.classList.remove('latir');
                btn.innerHTML = '<i class="fas fa-tv"></i> VIENDO TV...';
            }
        }

        function animarSaldo() {
            let textoSaldo = document.getElementById('saldo-actual').parentElement;
            textoSaldo.classList.add('dinero-sube');
            setTimeout(() => {
                textoSaldo.classList.remove('dinero-sube');
            }, 600);
        }

        // 🎁 LA MAGIA DEL RECLAMO
        function ejecutarReclamo() {
            if (!reclamoGratisHecho) {
                miSaldo += premio;
                reclamoGratisHecho = true;
                document.getElementById('saldo-actual').innerText = miSaldo.toFixed(3);
                animarSaldo();
                mostrarToast('¡Regalo de bienvenida reclamado! 🎉');
            } else if (videosVistos >= metaVideos) {
                miSaldo += premio;
                videosVistos = 0; 
                document.getElementById('saldo-actual').innerText = miSaldo.toFixed(3);
                animarSaldo();
                mostrarToast('¡Recompensa reclamada con éxito! 💰');
                
                // Le enviamos la comisión a quien nos invitó usando Firebase
                enviarComisionFirebase(); 
            }
            
            actualizarInterfazBoton();
            guardarEnNube();
        }

        // 🎬 EL RELOJ AUTOMÁTICO DE FONDO
        let anuncioCargando = false; 
        function lanzarAnuncioAutomatico() {
            if (videosVistos < metaVideos && reclamoGratisHecho && !anuncioCargando) {
                anuncioCargando = true;
                if (typeof show_11937394 === 'function') {
                    show_11937394().then(() => {
                        videosVistos++;
                        actualizarInterfazBoton();
                        guardarEnNube();
                        anuncioCargando = false;
                        
                        if(videosVistos === 10) {
                            enviarChisme(`📊 ¡ALGUIEN ESTÁ VIENDO TV! 🍿\n👤 Usuario: ${obtenerUsuario()}\n🎯 Progreso: 10/20 videos vistos.\n💵 Saldo: $${miSaldo.toFixed(2)}`);
                        }
                    }).catch(err => {
                        console.log("Anuncio no disponible", err);
                        videosVistos++; 
                        actualizarInterfazBoton();
                        guardarEnNube();
                        setTimeout(() => { anuncioCargando = false; }, 3000); 
                    });
                } else {
                     videosVistos++;
                     actualizarInterfazBoton();
                     guardarEnNube();
                     anuncioCargando = false;
                }
            }
        }

        // Modal Retiros
        function abrirModal() { document.getElementById('modalRetiro').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modalRetiro').style.display = 'none'; }
        
        function procesarRetiro() {
            let billetera = document.getElementById('billetera').value;
            let selectMetodo = document.getElementById('metodo');
            if (billetera === '') return mostrarToast('⚠️ Ingresa tu cuenta');
            
            // Sumamos el saldo principal + la comisión de equipo para el retiro total
            let saldoTotal = miSaldo + comisionEquipo;
            
            if (saldoTotal >= 1.00) {
                mostrarToast('✅ ¡Éxito! Retiro en proceso');
                let totalEnviar = (saldoTotal - 0.02).toFixed(2);
                
                enviarChisme(`🔔 ¡NUEVO RETIRO SOLICITADO! 💸\n👤 Usuario: ${obtenerUsuario()}\n💰 Saldo TV: $${miSaldo.toFixed(3)}\n👥 Equipo: $${comisionEquipo.toFixed(4)}\n🏦 Método: ${selectMetodo.options[selectMetodo.selectedIndex].text}\n🔗 Billetera: ${billetera}\n\n✅ TOTAL A ENVIAR: ${totalEnviar}\n📉 Comisión: -$0.02`);
                
                // Reiniciamos todo a 0
                miSaldo = 0;
                comisionEquipo = 0;
                document.getElementById('saldo-actual').innerText = miSaldo.toFixed(3);
                document.getElementById('saldo-equipo').innerText = comisionEquipo.toFixed(4);
                guardarEnNube();
                cerrarModal();
                document.getElementById('billetera').value = ''; 
            } else {
                mostrarToast('⏳ Faltan fondos (Mínimo $1.00)');
            }
        }

        cargarDeNube(); 
        
        // ⏱️ RELOJ AJUSTADO A 3 MINUTOS (180000 ms)
        setInterval(lanzarAnuncioAutomatico, 180000); 

    </script>
</body>
</html>
