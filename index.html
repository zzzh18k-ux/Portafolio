<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Temporal 📧✨</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .header {
            background: #1e293b;
            color: #ffffff;
            padding: 12px;
            text-align: center;
            font-size: 1.1rem;

        .iframe-container {
            width: 100%;

        }

            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="header">
        📬 Tu Bandeja Temporal 🚀

    <div class="iframe-container">
