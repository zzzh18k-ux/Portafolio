<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi App</title>
    <style>
        /* Hacemos que todo ocupe el 100% de la pantalla sin scroll */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; /* Evita que la página haga scroll */
            background-color: #f0f0f0;
        }

        /* El iframe ocupa todo el espacio superior */
        .iframe-app {
            flex: 1; 
            width: 100%;
            border: none;
        }

        /* La zona del anuncio fija abajo */
        .zona-anuncio {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 0;
            background: #ffffff;
            border-top: 1px solid #ddd;
            min-height: 70px; /* Altura para el banner de 50px + márgenes */
        }
    </style>
</head>
<body>

    <!-- 🖥️ AQUÍ ESTÁ FAMELACK EN EL IFRAME -->
    <iframe class="iframe-app" src="https://famelack.com/" allowfullscreen></iframe>

    <!-- 📢 AQUÍ ESTÁ EL ANUNCIO DE ADSTERRA -->

        <script>

</body>
</html>
